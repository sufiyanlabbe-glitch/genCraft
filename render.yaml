services:
  - type: web
    name: creatorai-studio
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: IMAGE_PROVIDER
        value: pollinations
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false

